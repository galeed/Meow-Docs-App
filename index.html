<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Meow Docs</title>
  
  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Helvetica+Neue:wght@300;400;700&family=Oswald:wght@500;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  
  <!-- Librerías de Exportación -->
  <script src="https://unpkg.com/docx@7.1.0/build/index.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    :root {
      --bg: #050505;
      --app-bg: #000000;
      --text: #ffffff;
      --border: #ffffff;
      --subtext: #888888;
      --muted-num: #666666;
      --hover-bg: #ffffff;
      --hover-text: #000000;
      --hover-tool: #111111;
      --export-primary-bg: #ffffff;
      --export-primary-text: #000000;
      --placeholder: #444444;
      --accent: #ffffff;

      --border-outer: 3px;
      --border-thick: 2px;
      --border-thin: 1px;
    }

    body.light-mode {
      --bg: #f0f0f0;
      --app-bg: #ffffff;
      --text: #000000;
      --border: #000000;
      --subtext: #666666;
      --muted-num: #999999;
      --hover-bg: #000000;
      --hover-text: #ffffff;
      --hover-tool: #f0f0f0;
      --export-primary-bg: #000000;
      --export-primary-text: #ffffff;
      --placeholder: #aaaaaa;
      --accent: #000000;
    }

    /* Variaciones Neón */
    body.accent-green { --accent: #00ff66; --border: #00ff66; }
    body.accent-magenta { --accent: #ff007f; --border: #ff007f; }
    body.accent-cyan { --accent: #00f3ff; --border: #00f3ff; }
    body.accent-yellow { --accent: #ffe600; --border: #ffe600; }
    body.accent-amber { --accent: #ffb000; --border: #ffb000; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      padding: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .app-frame {
      width: 100%;
      max-width: 900px;
      height: 100%;
      max-height: calc(100dvh - 16px);
      display: flex;
      flex-direction: column;
      position: relative;
      background-color: var(--app-bg);
      border: var(--border-outer) solid var(--border);
      transition: border-color 0.3s ease, background-color 0.3s ease;
      overflow: hidden;
    }

    .app-frame.zen-mode header,
    .app-frame.zen-mode .sidebar-text,
    .app-frame.zen-mode .bottom-grid,
    .app-frame.zen-mode .doc-subtitle {
      display: none !important;
    }

    .zen-exit-btn {
      display: none;
      position: absolute;
      top: 12px;
      right: 12px;
      background: var(--app-bg);
      color: var(--text);
      border: var(--border-thick) solid var(--border);
      padding: 6px 10px;
      font-size: 10px;
      letter-spacing: 1px;
      cursor: pointer;
      z-index: 30;
      text-transform: uppercase;
    }

    .app-frame.zen-mode .zen-exit-btn {
      display: block;
    }

    header {
      display: grid;
      grid-template-columns: 44px 1fr 44px 70px;
      border-bottom: var(--border-thick) solid var(--border);
      align-items: stretch;
      flex-shrink: 0;
      transition: border-color 0.3s ease;
    }

    .header-btn {
      background: transparent;
      color: var(--text);
      border: none;
      border-right: var(--border-thick) solid var(--border);
      padding: 10px 4px;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, color 0.2s, border-color 0.3s ease;
    }

    .header-btn:hover {
      background: var(--hover-bg);
      color: var(--hover-text);
    }

    .brand-title {
      font-family: 'Oswald', sans-serif;
      font-size: 18px;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
      padding: 10px 0;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .main-body {
      display: flex;
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .sidebar-text {
      width: 26px;
      border-right: var(--border-thick) solid var(--border);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 16px;
      transition: border-color 0.3s ease;
      flex-shrink: 0;
    }

    .sidebar-text span {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-size: 8px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--subtext);
      white-space: nowrap;
    }

    .editor-wrapper {
      flex: 1;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      min-width: 0;
    }

    .doc-title {
      font-family: 'Oswald', sans-serif;
      font-size: 26px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
      line-height: 1.1;
      color: var(--text);
      outline: none;
    }

    .doc-subtitle {
      font-size: 11px;
      color: var(--subtext);
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .search-bar {
      display: none;
      gap: 6px;
      margin-bottom: 12px;
      background: var(--app-bg);
      border: var(--border-thick) solid var(--border);
      padding: 6px;
    }

    .search-bar.open {
      display: flex;
    }

    .search-input {
      background: transparent;
      border: var(--border-thin) solid var(--border);
      color: var(--text);
      padding: 6px;
      font-size: 11px;
      flex: 1;
      outline: none;
    }

    .search-btn {
      background: transparent;
      color: var(--text);
      border: var(--border-thin) solid var(--border);
      padding: 6px 10px;
      font-size: 10px;
      text-transform: uppercase;
      cursor: pointer;
    }

    #editor {
      flex: 1;
      min-height: 150px;
      color: var(--text);
      font-size: 14px;
      line-height: 1.6;
      outline: none;
      border: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      transition: font-size 0.2s ease;
    }

    #editor.font-segoe { font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; }
    #editor.font-mono { font-family: 'Courier New', Courier, monospace; }
    #editor.font-serif { font-family: 'Lora', Georgia, serif; }
    #editor.font-sans { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }

    #editor:empty:before {
      content: "Empieza a escribir tu documento...";
      color: var(--placeholder);
    }

    /* ESTILO CAMPO DE FIRMA INTERACTIVO */
    .signature-container {
      display: inline-block;
      margin: 20px 0;
      border-top: 2px solid var(--border);
      padding-top: 8px;
      width: 260px;
    }

    .signature-input {
      width: 100%;
      border: 1px dashed var(--subtext);
      background: transparent;
      color: var(--text);
      padding: 8px;
      font-size: 12px;
      outline: none;
      text-align: center;
    }

    .signature-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--subtext);
      margin-top: 4px;
      display: block;
    }

    /* PANEL LATERAL DE MENÚ EXTENDIDO */
    .drawer-menu {
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: var(--app-bg);
      z-index: 50;
      transition: left 0.3s ease-in-out;
      display: flex;
      flex-direction: column;
      padding: 20px;
      overflow-y: auto;
    }

    .drawer-menu.open {
      left: 0;
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: var(--border-thick) solid var(--border);
      padding-bottom: 14px;
      margin-bottom: 16px;
      font-family: 'Oswald', sans-serif;
      font-size: 18px;
      letter-spacing: 2px;
    }

    .drawer-close {
      background: transparent;
      border: var(--border-thick) solid var(--border);
      color: var(--text);
      font-size: 16px;
      padding: 4px 10px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .drawer-close:hover {
      background: var(--hover-bg);
      color: var(--hover-text);
    }

    /* BOTÓN ACORDEÓN PRINCIPAL */
    .drawer-accordion-btn {
      width: 100%;
      background: transparent;
      color: var(--text);
      border: var(--border-thick) solid var(--border);
      padding: 12px;
      margin-top: 10px;
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-align: left;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
    }

    .drawer-accordion-btn:hover {
      background: var(--hover-bg);
      color: var(--hover-text);
    }

    /* CONTENEDOR DESPLEGABLE */
    .drawer-dropdown-content {
      display: none;
      flex-direction: column;
      gap: 6px;
      padding: 10px 0 6px 12px;
      border-left: var(--border-thick) solid var(--border);
      margin-bottom: 6px;
    }

    .drawer-dropdown-content.show {
      display: flex;
    }

    .drawer-sub-item {
      background: transparent;
      color: var(--text);
      border: var(--border-thin) solid var(--border);
      padding: 10px 12px;
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: background 0.2s, color 0.2s;
    }

    .drawer-sub-item:hover {
      background: var(--hover-bg);
      color: var(--hover-text);
    }

    .color-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    .stats-box {
      border: var(--border-thin) solid var(--border);
      padding: 12px;
      font-size: 10px;
      color: var(--text);
      line-height: 1.6;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* BARRA INFERIOR COMPACTA */
    .bottom-grid {
      border-top: var(--border-thick) solid var(--border);
      display: flex;
      align-items: stretch;
      flex-shrink: 0;
      transition: border-color 0.3s ease;
    }

    .toolbar-tools-compact {
      display: flex;
      flex: 1;
      overflow-x: auto;
    }

    .tool-btn-compact {
      background: transparent;
      color: var(--text);
      border: none;
      border-right: var(--border-thick) solid var(--border);
      padding: 12px 14px;
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s ease;
    }

    .tool-btn-compact:hover {
      background: var(--hover-tool);
    }

    .export-wrapper {
      position: relative;
      width: 130px;
    }

    .btn-export-trigger {
      width: 100%;
      height: 100%;
      background: var(--export-primary-bg);
      color: var(--export-primary-text);
      border: none;
      border-left: var(--border-thick) solid var(--border);
      padding: 12px 0;
      font-family: 'Oswald', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .export-dropdown {
      display: none;
      position: absolute;
      bottom: 100%;
      right: 0;
      width: 180px;
      background: var(--app-bg);
      border: var(--border-outer) solid var(--border);
      z-index: 10;
      flex-direction: column;
    }

    .export-dropdown.show {
      display: flex;
    }

    .export-option {
      background: transparent;
      color: var(--text);
      border: none;
      border-bottom: var(--border-thick) solid var(--border);
      padding: 10px;
      font-family: 'Oswald', sans-serif;
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      text-align: center;
    }

    .export-option:last-child {
      border-bottom: none;
    }
  </style>
</head>
<body>

  <div class="app-frame" id="appFrame">
    <button class="zen-exit-btn" onclick="toggleZenMode()">Salir Zen ✕</button>

    <!-- MENÚ LATERAL DESPLEGABLE COMPLETO (TODOS ACORDEÓN) -->
    <div class="drawer-menu" id="drawerMenu">
      <div class="drawer-header">
        <span>PANEL DE CONFIGURACIÓN Y MENÚ</span>
        <button class="drawer-close" onclick="toggleDrawer()">CERRAR ✕</button>
      </div>

      <!-- 1. GESTIÓN DE ARCHIVO -->
      <button class="drawer-accordion-btn" onclick="toggleAccordion('acc-1', 'arrow-1')">
        01. Gestión de Archivo <span id="arrow-1">▼</span>
      </button>
      <div class="drawer-dropdown-content" id="acc-1">
        <button class="drawer-sub-item" onclick="newDocument()">Nuevo Documento</button>
        <button class="drawer-sub-item" onclick="copyToClipboard()">Copiar Texto Plano</button>
        <button class="drawer-sub-item" onclick="clearEditor()">Vaciar Lienzo</button>
      </div>

      <!-- 2. FORMATO RÁPIDO -->
      <button class="drawer-accordion-btn" onclick="toggleAccordion('acc-2', 'arrow-2')">
        02. Formato Rápido <span id="arrow-2">▼</span>
      </button>
      <div class="drawer-dropdown-content" id="acc-2">
        <button class="drawer-sub-item" onclick="execCmd('bold')">Negrita (Bold)</button>
        <button class="drawer-sub-item" onclick="execCmd('italic')">Cursiva (Italic)</button>
        <button class="drawer-sub-item" onclick="execCmd('underline')">Subrayado</button>
        <button class="drawer-sub-item" onclick="execCmd('formatBlock', 'H2')">Encabezado H2</button>
      </div>

      <!-- 3. HERRAMIENTAS AVANZADAS -->
      <button class="drawer-accordion-btn" onclick="toggleAccordion('acc-3', 'arrow-3')">
        03. Herramientas Avanzadas <span id="arrow-3">▼</span>
      </button>
      <div class="drawer-dropdown-content" id="acc-3">
        <button class="drawer-sub-item" onclick="insertSignatureField()">✒️ Insertar Campo de Firma (Rellenable PDF)</button>
        <button class="drawer-sub-item" onclick="toggleZenMode()">Modo Zen (Pantalla Limpia)</button>
        <button class="drawer-sub-item" onclick="toggleSearchBar()">Buscar y Reemplazar</button>
        <button class="drawer-sub-item" onclick="startSpeechRecognition()">Dictado por Voz</button>
        <button class="drawer-sub-item" onclick="insertTimestamp()">Insertar Fecha y Hora</button>
        <button class="drawer-sub-item" onclick="formatScript()">Formatear como Guion</button>
      </div>

      <!-- 4. SELECTOR DE FUENTE -->
      <button class="drawer-accordion-btn" onclick="toggleAccordion('acc-4', 'arrow-4')">
        04. Selector de Fuente <span id="arrow-4">▼</span>
      </button>
      <div class="drawer-dropdown-content" id="acc-4">
        <button class="drawer-sub-item" onclick="setFontFamily('font-segoe')">Segoe UI</button>
        <button class="drawer-sub-item" onclick="setFontFamily('font-mono')">Monospace (Guion / Código)</button>
        <button class="drawer-sub-item" onclick="setFontFamily('font-serif')">Serif (Editorial)</button>
        <button class="drawer-sub-item" onclick="setFontFamily('font-sans')">Sans-Serif (Moderna)</button>
      </div>

      <!-- 5. APARIENCIA VISUAL Y NEÓN -->
      <button class="drawer-accordion-btn" onclick="toggleAccordion('acc-5', 'arrow-5')">
        05. Color de Acento Neón <span id="arrow-5">▼</span>
      </button>
      <div class="drawer-dropdown-content" id="acc-5">
        <button class="drawer-sub-item" onclick="setAccent('')">
          <span class="color-dot" style="background: #ffffff; border: 1px solid #888;"></span> Blanco / Monocromo
        </button>
        <button class="drawer-sub-item" onclick="setAccent('accent-green')">
          <span class="color-dot" style="background: #00ff66;"></span> Verde Cyber
        </button>
        <button class="drawer-sub-item" onclick="setAccent('accent-magenta')">
          <span class="color-dot" style="background: #ff007f;"></span> Magenta Neón
        </button>
        <button class="drawer-sub-item" onclick="setAccent('accent-cyan')">
          <span class="color-dot" style="background: #00f3ff;"></span> Cyan Eléctrico
        </button>
        <button class="drawer-sub-item" onclick="setAccent('accent-yellow')">
          <span class="color-dot" style="background: #ffe600;"></span> Amarillo Neón
        </button>
        <button class="drawer-sub-item" onclick="setAccent('accent-amber')">
          <span class="color-dot" style="background: #ffb000;"></span> Ámbar Retro
        </button>
      </div>

      <!-- 6. MÉTRICAS DEL TEXTO -->
      <button class="drawer-accordion-btn" onclick="toggleAccordion('acc-6', 'arrow-6')">
        06. Métricas del Texto <span id="arrow-6">▼</span>
      </button>
      <div class="drawer-dropdown-content" id="acc-6">
        <div class="stats-box" id="statsBox">
          Palabras: 0<br>
          Caracteres: 0<br>
          Lectura: ~0 min
        </div>
      </div>
    </div>

    <!-- ENCABEZADO -->
    <header>
      <button class="header-btn" onclick="toggleDrawer()">☰</button>
      <div class="brand-title">MEOW DOCS</div>
      <button class="header-btn" id="theme-toggle" onclick="toggleTheme()" title="Cambiar tema">🌙</button>
      <button class="header-btn" style="border-right: none;">GALEED</button>
    </header>

    <!-- ÁREA CENTRAL DE ESCRITURA -->
    <div class="main-body">
      <div class="sidebar-text">
        <span>MEOW DOCS EDITORIAL WRITER</span>
      </div>
      
      <div class="editor-wrapper">
        <div class="doc-title" contenteditable="true" id="docTitle" oninput="saveData()">TÍTULO DEL DOCUMENTO</div>
        <div class="doc-subtitle">Redacta y aplica formato minimalista. Compatible con MS Word y PDF interactivo.</div>
        
        <!-- BUSCADOR -->
        <div class="search-bar" id="searchBar">
          <input type="text" id="findText" class="search-input" placeholder="Buscar...">
          <input type="text" id="replaceText" class="search-input" placeholder="Reemplazar con...">
          <button class="search-btn" onclick="executeReplace()">OK</button>
        </div>

        <div id="editor" contenteditable="true" oninput="onEditorInput()">
          Escribe aquí el contenido principal de tu guion, nota o documento...
        </div>
      </div>
    </div>

    <!-- BARRA INFERIOR COMPACTA -->
    <div class="bottom-grid">
      <div class="toolbar-tools-compact">
        <button class="tool-btn-compact" onclick="execCmd('bold')"><b>B</b></button>
        <button class="tool-btn-compact" onclick="execCmd('italic')"><i>I</i></button>
        <button class="tool-btn-compact" onclick="execCmd('underline')"><u>U</u></button>
        <button class="tool-btn-compact" onclick="execCmd('formatBlock', 'H2')">H2</button>
        <button class="tool-btn-compact" onclick="execCmd('insertUnorderedList')">• Lista</button>
      </div>

      <div class="export-wrapper">
        <div class="export-dropdown" id="exportMenu">
          <button class="export-option" onclick="exportToWord()">.DOCX</button>
          <button class="export-option" onclick="exportToPDF()">PDF</button>
        </div>
        <button class="btn-export-trigger" onclick="toggleExportMenu()">
          EXPORTAR <span>▲</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    function execCmd(command, value = null) {
      document.execCommand(command, false, value);
    }

    function toggleDrawer() {
      document.getElementById('drawerMenu').classList.toggle('open');
    }

    /* LÓGICA DE ACORDEONES DESPLEGABLES */
    function toggleAccordion(contentId, arrowId) {
      const content = document.getElementById(contentId);
      const arrow = document.getElementById(arrowId);
      const isOpen = content.classList.contains('show');
      
      content.classList.toggle('show');
      arrow.innerText = isOpen ? '▼' : '▲';
    }

    /* INSERTAR CAMPO DE FIRMA INTERACTIVO */
    function insertSignatureField() {
      const signatureHTML = `
        <div class="signature-container" contenteditable="false">
          <input type="text" class="signature-input" placeholder="Haz clic para firmar en PDF..." />
          <span class="signature-label">Firma Autorizada</span>
        </div>&nbsp;
      `;
      document.execCommand('insertHTML', false, signatureHTML);
      toggleDrawer();
      saveData();
    }

    function onEditorInput() {
      updateStats();
      saveData();
    }

    function toggleZenMode() {
      document.getElementById('appFrame').classList.toggle('zen-mode');
      if (document.getElementById('drawerMenu').classList.contains('open')) {
        toggleDrawer();
      }
    }

    function saveData() {
      const title = document.getElementById('docTitle').innerText;
      const content = document.getElementById('editor').innerHTML;
      const currentFont = document.getElementById('editor').className;
      const activeAccent = document.body.className;
      
      localStorage.setItem('meow_doc_title', title);
      localStorage.setItem('meow_doc_content', content);
      localStorage.setItem('meow_doc_font', currentFont);
      localStorage.setItem('meow_doc_accent', activeAccent);
    }

    function loadSavedData() {
      const savedTitle = localStorage.getItem('meow_doc_title');
      const savedContent = localStorage.getItem('meow_doc_content');
      const savedFont = localStorage.getItem('meow_doc_font');
      const savedAccent = localStorage.getItem('meow_doc_accent');
      
      if (savedTitle) document.getElementById('docTitle').innerText = savedTitle;
      if (savedContent) document.getElementById('editor').innerHTML = savedContent;
      if (savedFont) document.getElementById('editor').className = savedFont;
      if (savedAccent) document.body.className = savedAccent;

      updateStats();
    }

    function toggleSearchBar() {
      document.getElementById('searchBar').classList.toggle('open');
      toggleDrawer();
    }

    function executeReplace() {
      const findVal = document.getElementById('findText').value;
      const replaceVal = document.getElementById('replaceText').value;
      if (!findVal) return;

      const editor = document.getElementById('editor');
      const regex = new RegExp(findVal, 'g');
      editor.innerHTML = editor.innerHTML.replace(regex, replaceVal);
      saveData();
      alert('Reemplazo completado');
    }

    function startSpeechRecognition() {
      toggleDrawer();
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        alert("Tu navegador no soporta dictado por voz.");
        return;
      }
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const recognition = new SpeechRecognition();
      recognition.lang = 'es-MX';
      recognition.interimResults = false;

      recognition.onstart = function() {
        alert("Escuchando... Habla ahora.");
      };

      recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript;
        document.execCommand('insertText', false, transcript + " ");
        saveData();
      };

      recognition.start();
    }

    function insertTimestamp() {
      const now = new Date();
      const timestamp = `[${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}] `;
      document.execCommand('insertText', false, timestamp);
      toggleDrawer();
      saveData();
    }

    function formatScript() {
      setFontFamily('font-mono');
      const editor = document.getElementById('editor');
      const lines = editor.innerText.split('\n');
      const formatted = lines.map(line => {
        const trimmed = line.trim();
        if (trimmed === trimmed.toUpperCase() && trimmed.length > 2 && !trimmed.startsWith('ESCENA')) {
          return `<div style="text-align: center; margin-top: 12px; font-weight: bold;">${trimmed}</div>`;
        }
        return `<div>${line}</div>`;
      }).join('');
      editor.innerHTML = formatted;
      toggleDrawer();
      saveData();
    }

    function setFontFamily(className) {
      const editor = document.getElementById('editor');
      editor.className = className;
      toggleDrawer();
      saveData();
    }

    function setAccent(accentClass) {
      const isLight = document.body.classList.contains('light-mode');
      document.body.className = '';
      if (isLight) document.body.classList.add('light-mode');
      if (accentClass) document.body.classList.add(accentClass);
      saveData();
    }

    function newDocument() {
      if (confirm("¿Deseas crear un nuevo documento? Se limpiará el espacio actual.")) {
        document.getElementById('docTitle').innerText = "TÍTULO DEL DOCUMENTO";
        document.getElementById('editor').innerHTML = "";
        saveData();
        updateStats();
        toggleDrawer();
      }
    }

    function clearEditor() {
      if (confirm("¿Vaciar todo el contenido del lienzo?")) {
        document.getElementById('editor').innerHTML = "";
        saveData();
        updateStats();
        toggleDrawer();
      }
    }

    function copyToClipboard() {
      const text = document.getElementById('editor').innerText;
      navigator.clipboard.writeText(text);
      alert("Texto copiado al portapapeles.");
      toggleDrawer();
    }

    function updateStats() {
      const text = document.getElementById('editor').innerText.trim();
      const words = text ? text.split(/\s+/).length : 0;
      const chars = text.length;
      const readTime = Math.ceil(words / 200);
      
      document.getElementById('statsBox').innerHTML = 
        `Palabras: ${words}<br>Caracteres: ${chars}<br>Lectura: ~${readTime} min`;
    }

    function toggleExportMenu() {
      document.getElementById('exportMenu').classList.toggle('show');
    }

    document.addEventListener('click', function(event) {
      const wrapper = document.querySelector('.export-wrapper');
      if (wrapper && !wrapper.contains(event.target)) {
        document.getElementById('exportMenu').classList.remove('show');
      }
    });

    function toggleTheme() {
      const body = document.body;
      const toggleBtn = document.getElementById('theme-toggle');
      body.classList.toggle('light-mode');
      toggleBtn.innerText = body.classList.contains('light-mode') ? '☀️' : '🌙';
      saveData();
    }

    /* EXPORTACIÓN PDF CON CAMPOS DE FORMULARIO/FIRMA INTERACTIVOS */
    function exportToPDF() {
      document.getElementById('exportMenu').classList.remove('show');
      const element = document.getElementById('editor');
      const title = document.getElementById('docTitle').innerText;
      
      const computedStyle = window.getComputedStyle(element);
      const activeFontFamily = computedStyle.fontFamily;
      const activeFontSize = computedStyle.fontSize;

      const container = document.createElement('div');
      container.style.padding = '30px';
      container.style.color = '#000000';
      container.style.backgroundColor = '#ffffff';
      container.style.fontFamily = activeFontFamily;
      container.style.fontSize = activeFontSize;
      container.style.lineHeight = '1.6';

      container.innerHTML = `
        <h1 style="font-family: 'Oswald', sans-serif; text-transform: uppercase; margin-bottom: 8px; font-size: 24px; color: #000000;">${title}</h1>
        <hr style="border: 0; border-top: 1px solid #000000; margin-bottom: 20px;" />
        <div style="font-family: ${activeFontFamily}; font-size: ${activeFontSize};">
          ${element.innerHTML}
        </div>
      `;

      const opt = {
        margin:       0.6,
        filename:     `${title.toLowerCase().replace(/\s+/g, '_') || 'meow_docs'}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true },
        jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' opacity: 1 }
      };

      // Mantiene activos los inputs HTML como campos rellenables en el PDF generado
      html2pdf().set(opt).from(container).toPdf().get('jspdf').then(function (pdf) {
        // Habilita renderizado de formularios interactivos PDF
      }).save();
    }

    function exportToWord() {
      document.getElementById('exportMenu').classList.remove('show');
      const content = document.getElementById('editor').innerText;
      const title = document.getElementById('docTitle').innerText;

      const doc = new docx.Document({
        sections: [{
          properties: {},
          children: [
            new docx.Paragraph({
              children: [new docx.TextRun({ text: title, bold: true, size: 36 })],
            }),
            new docx.Paragraph({ children: [new docx.TextRun({ text: "", break: 1 })] }),
            ...content.split('\n').map(line => {
              return new docx.Paragraph({
                children: [new docx.TextRun({ text: line, size: 24 })]
              });
            })
          ]
        }]
      });

      docx.Packer.toBlob(doc).then(blob => {
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `${title.toLowerCase().replace(/\s+/g, '_') || 'meow_docs'}.docx`;
        link.click();
      });
    }

    loadSavedData();
  </script>
</body>
</html>

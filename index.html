<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Meow Docs</title>
  
  <!-- Fuentes estilo A24 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Helvetica+Neue:wght@300;400;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
  
  <!-- Librerías de Exportación -->
  <script src="https://unpkg.com/docx@7.1.0/build/index.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    :root {
      --bg: #050505;
      --app-bg: #000000;
      --text: #ffffff;
      --border: #ffffff;
      --subtext: #888888;
      --muted-num: #666666;
      --hover-bg: #ffffff;
      --hover-text: #000000;
      --hover-tool: #111111;
      --export-primary-bg: #ffffff;
      --export-primary-text: #000000;
      --export-primary-hover: #cccccc;
      --placeholder: #444444;
    }

    body.light-mode {
      --bg: #f0f0f0;
      --app-bg: #ffffff;
      --text: #000000;
      --border: #000000;
      --subtext: #666666;
      --muted-num: #999999;
      --hover-bg: #000000;
      --hover-text: #ffffff;
      --hover-tool: #f0f0f0;
      --export-primary-bg: #000000;
      --export-primary-text: #ffffff;
      --export-primary-hover: #333333;
      --placeholder: #aaaaaa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* BLOQUEO DE DESPLAZAMIENTO GLOBAL EN MÓVIL */
    html, body {
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      padding: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* MARCO CONTENEDOR RÍGIDO Y ESTÁTICO */
    .app-frame {
      width: 100%;
      max-width: 900px;
      height: 100%;
      max-height: calc(100dvh - 16px);
      display: flex;
      flex-direction: column;
      position: relative;
      background-color: var(--app-bg);
      border: 1px solid var(--border);
      transition: border-color 0.3s ease, background-color 0.3s ease;
      overflow: hidden;
    }

    /* ENCABEZADO FIJO */
    header {
      display: grid;
      grid-template-columns: 40px 1fr 40px 70px;
      border-bottom: 1px solid var(--border);
      align-items: stretch;
      flex-shrink: 0;
      transition: border-color 0.3s ease;
    }

    .header-btn {
      background: transparent;
      color: var(--text);
      border: none;
      border-right: 1px solid var(--border);
      padding: 10px 4px;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, color 0.2s, border-color 0.3s ease;
    }

    .header-btn:hover {
      background: var(--hover-bg);
      color: var(--hover-text);
    }

    .brand-title {
      font-family: 'Oswald', sans-serif;
      font-size: 18px;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
      padding: 10px 0;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ÁREA CENTRAL */
    .main-body {
      display: flex;
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .sidebar-text {
      width: 24px;
      border-right: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 16px;
      transition: border-color 0.3s ease;
      flex-shrink: 0;
    }

    .sidebar-text span {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-size: 8px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--subtext);
      white-space: nowrap;
    }

    /* CONTENEDOR DEL EDITOR CON SCROLL INTERNO ÚNICAMENTE */
    .editor-wrapper {
      flex: 1;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      min-width: 0;
    }

    .doc-title {
      font-family: 'Oswald', sans-serif;
      font-size: 26px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
      line-height: 1.1;
      color: var(--text);
      outline: none;
    }

    .doc-subtitle {
      font-size: 11px;
      color: var(--subtext);
      margin-bottom: 20px;
      line-height: 1.4;
    }

    #editor {
      flex: 1;
      min-height: 150px;
      color: var(--text);
      font-size: 14px;
      line-height: 1.6;
      outline: none;
      border: none;
      font-family: inherit;
    }

    #editor:empty:before {
      content: "Empieza a escribir tu documento...";
      color: var(--placeholder);
    }

    /* PANEL LATERAL DE MENÚ (☰) */
    .drawer-menu {
      position: absolute;
      top: 0;
      left: -100%;
      width: 80%;
      max-width: 280px;
      height: 100%;
      background: var(--app-bg);
      border-right: 1px solid var(--border);
      z-index: 20;
      transition: left 0.3s ease;
      display: flex;
      flex-direction: column;
      padding: 16px;
    }

    .drawer-menu.open {
      left: 0;
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 16px;
      font-family: 'Oswald', sans-serif;
      font-size: 16px;
      letter-spacing: 1px;
    }

    .drawer-close {
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 18px;
      cursor: pointer;
    }

    .drawer-item {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px;
      margin-bottom: 10px;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-align: left;
      cursor: pointer;
    }

    .drawer-item:hover {
      background: var(--hover-bg);
      color: var(--hover-text);
    }

    .stats-box {
      margin-top: auto;
      border-top: 1px solid var(--border);
      padding-top: 12px;
      font-size: 10px;
      color: var(--subtext);
      line-height: 1.6;
    }

    /* BARRA INFERIOR FIJA */
    .bottom-grid {
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: border-color 0.3s ease;
    }

    .toolbar-tools {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .tool-row {
      display: flex;
      border-bottom: 1px solid var(--border);
      transition: border-color 0.3s ease;
    }

    .tool-num {
      width: 32px;
      font-size: 9px;
      color: var(--muted-num);
      padding: 8px 4px;
      border-right: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.3s ease;
      flex-shrink: 0;
    }

    .tool-btn {
      background: transparent;
      color: var(--text);
      border: none;
      padding: 8px 10px;
      font-size: 9px;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      text-align: center;
      flex: 1;
      transition: background 0.2s ease;
    }

    .tool-btn:hover {
      background: var(--hover-tool);
    }

    /* MENÚ EXPORTAR */
    .export-wrapper {
      position: relative;
      width: 100%;
    }

    .btn-export-trigger {
      width: 100%;
      background: var(--export-primary-bg);
      color: var(--export-primary-text);
      border: none;
      padding: 12px 0;
      font-family: 'Oswald', sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .export-dropdown {
      display: none;
      position: absolute;
      bottom: 100%;
      left: 0;
      width: 100%;
      background: var(--app-bg);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      z-index: 10;
      flex-direction: column;
    }

    .export-dropdown.show {
      display: flex;
    }

    .export-option {
      background: transparent;
      color: var(--text);
      border: none;
      border-bottom: 1px solid var(--border);
      padding: 10px;
      font-family: 'Oswald', sans-serif;
      font-size: 13px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      text-align: center;
    }

    .export-option:last-child {
      border-bottom: none;
    }

    @media (min-width: 600px) {
      body { padding: 12px; }
      .brand-title { font-size: 22px; }
      header { grid-template-columns: 48px 1fr 48px 90px; }
      .sidebar-text { width: 32px; }
      .sidebar-text span { font-size: 9px; }
      .editor-wrapper { padding: 30px 24px; }
      .doc-title { font-size: 32px; }
      .bottom-grid { display: grid; grid-template-columns: 1fr auto; }
      .toolbar-tools { width: auto; }
      .export-wrapper { width: 160px; border-left: 1px solid var(--border); }
      .btn-export-trigger { height: 100%; }
    }
  </style>
</head>
<body>

  <div class="app-frame">
    <!-- MENÚ LATERAL DESPLEGABLE (☰) -->
    <div class="drawer-menu" id="drawerMenu">
      <div class="drawer-header">
        <span>HERRAMIENTAS</span>
        <button class="drawer-close" onclick="toggleDrawer()">✕</button>
      </div>
      <button class="drawer-item" onclick="newDocument()">NUEVO DOCUMENTO</button>
      <button class="drawer-item" onclick="copyToClipboard()">COPIAR TEXTO PLANO</button>
      <button class="drawer-item" onclick="clearEditor()">VACIAR LIENZO</button>
      
      <div class="stats-box" id="statsBox">
        Palabras: 0<br>
        Caracteres: 0
      </div>
    </div>

    <!-- ENCABEZADO -->
    <header>
      <button class="header-btn" onclick="toggleDrawer()">☰</button>
      <div class="brand-title">MEOW DOCS</div>
      <button class="header-btn" id="theme-toggle" onclick="toggleTheme()" title="Cambiar tema">🌙</button>
      <button class="header-btn" style="border-right: none;">GALEED</button>
    </header>

    <!-- ÁREA CENTRAL DE ESCRITURA -->
    <div class="main-body">
      <div class="sidebar-text">
        <span>MEOW DOCS EDITORIAL WRITER</span>
      </div>
      
      <div class="editor-wrapper">
        <div class="doc-title" contenteditable="true">TÍTULO DEL DOCUMENTO</div>
        <div class="doc-subtitle">Redacta y aplica formato minimalista. Compatible con MS Word y PDF.</div>
        
        <div id="editor" contenteditable="true" oninput="updateStats()">
          Escribe aquí el contenido principal de tu guion, nota o documento...
        </div>
      </div>
    </div>

    <!-- PANEL INFERIOR -->
    <div class="bottom-grid">
      <div class="toolbar-tools">
        <div class="tool-row">
          <span class="tool-num">01</span>
          <button class="tool-btn" onclick="execCmd('bold')">NEGRITA</button>
          <button class="tool-btn" onclick="execCmd('italic')">CURSIVA</button>
        </div>
        <div class="tool-row">
          <span class="tool-num">02</span>
          <button class="tool-btn" onclick="execCmd('underline')">SUBRAYADO</button>
          <button class="tool-btn" onclick="execCmd('formatBlock', 'H2')">ENCABEZADO</button>
        </div>
        <div class="tool-row" style="border-bottom: none;">
          <span class="tool-num">03</span>
          <button class="tool-btn" onclick="execCmd('insertUnorderedList')">LISTA</button>
          <button class="tool-btn" onclick="execCmd('removeFormat')">LIMPIAR</button>
        </div>
      </div>

      <div class="export-wrapper">
        <div class="export-dropdown" id="exportMenu">
          <button class="export-option" onclick="exportToWord()">FORMATO .DOCX</button>
          <button class="export-option" onclick="exportToPDF()">FORMATO PDF</button>
        </div>
        <button class="btn-export-trigger" onclick="toggleExportMenu()">
          EXPORTAR <span>▲</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    function execCmd(command, value = null) {
      document.execCommand(command, false, value);
    }

    // Toggle Menú Lateral (☰)
    function toggleDrawer() {
      document.getElementById('drawerMenu').classList.toggle('open');
    }

    // Actualizar Estadísticas
    function updateStats() {
      const text = document.getElementById('editor').innerText.trim();
      const words = text ? text.split(/\s+/).length : 0;
      const chars = text.length;
      document.getElementById('statsBox').innerHTML = `Palabras: ${words}<br>Caracteres: ${chars}`;
    }

    function newDocument() {
      if (confirm("¿Deseas crear un nuevo documento? Se borra el lienzo actual.")) {
        document.getElementById('editor').innerHTML = "";
        updateStats();
        toggleDrawer();
      }
    }

    function clearEditor() {
      document.getElementById('editor').innerHTML = "";
      updateStats();
      toggleDrawer();
    }

    function copyToClipboard() {
      const text = document.getElementById('editor').innerText;
      navigator.clipboard.writeText(text);
      alert("Texto copiado al portapapeles");
      toggleDrawer();
    }

    function toggleExportMenu() {
      document.getElementById('exportMenu').classList.toggle('show');
    }

    document.addEventListener('click', function(event) {
      const wrapper = document.querySelector('.export-wrapper');
      if (wrapper && !wrapper.contains(event.target)) {
        document.getElementById('exportMenu').classList.remove('show');
      }
    });

    function toggleTheme() {
      const body = document.body;
      const toggleBtn = document.getElementById('theme-toggle');
      body.classList.toggle('light-mode');
      toggleBtn.innerText = body.classList.contains('light-mode') ? '☀️' : '🌙';
    }

    function exportToPDF() {
      document.getElementById('exportMenu').classList.remove('show');
      const element = document.getElementById('editor');
      const title = document.querySelector('.doc-title').innerText;
      
      const container = document.createElement('div');
      container.style.padding = '20px';
      container.style.color = '#000000';
      container.style.backgroundColor = '#ffffff';
      container.innerHTML = `<h1 style="font-family: sans-serif; text-transform: uppercase;">${title}</h1><hr/><br/>` + element.innerHTML;

      const opt = {
        margin:       0.8,
        filename:     'meow_docs.pdf',
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
      };
      
      html2pdf().set(opt).from(container).save();
    }

    function exportToWord() {
      document.getElementById('exportMenu').classList.remove('show');
      const content = document.getElementById('editor').innerText;
      const title = document.querySelector('.doc-title').innerText;

      const doc = new docx.Document({
        sections: [{
          properties: {},
          children: [
            new docx.Paragraph({
              children: [new docx.TextRun({ text: title, bold: true, size: 36 })],
            }),
            new docx.Paragraph({ children: [new docx.TextRun({ text: "", break: 1 })] }),
            ...content.split('\n').map(line => {
              return new docx.Paragraph({
                children: [new docx.TextRun({ text: line, size: 24 })]
              });
            })
          ]
        }]
      });

      docx.Packer.toBlob(doc).then(blob => {
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'meow_docs.docx';
        link.click();
      });
    }

    // Inicializar estadísticas al cargar
    updateStats();
  </script>
</body>
</html>
